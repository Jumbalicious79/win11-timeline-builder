name: CI

on:
  push:
    branches: [master]
  # Every pull request, whatever its base branch: a PR stacked on another
  # PR's branch gets the same checks as a PR into master
  pull_request:

permissions:
  contents: read

jobs:
  parse:
    # The .bat launchers run the scripts in Windows PowerShell 5.1, so both
    # editions must parse every script
    name: Parse (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      - name: Parse all scripts
        run: |
          $root = (Get-Location).Path
          $failed = $false
          foreach ($file in Get-ChildItem -Path . -Filter *.ps1 -Recurse) {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
              $relPath = $file.FullName.Substring($root.Length + 1).Replace('\', '/')
              foreach ($e in $errors) {
                  Write-Host "::error file=$relPath,line=$($e.Extent.StartLineNumber)::$($e.Message)"
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }
          Write-Host "All scripts parse in PowerShell $($PSVersionTable.PSVersion)"

  parser-tests:
    # Runs the builder on each fixture collection in tests\fixtures and
    # compares the timelines with the expected rows (Windows runners are
    # elevated, which the builder requires)
    name: Parser tests (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      - name: Run parser tests
        run: ./tests/Test-Parsers.ps1

      # The steps below run even if an earlier one failed, so one run
      # reports every failing parser
      - name: Run $MFT parser test
        if: ${{ !cancelled() }}
        run: ./tests/Test-MftParser.ps1

      - name: Run browser parser tests
        if: ${{ !cancelled() }}
        run: ./tests/Test-BrowserParsers.ps1

      - name: Run browser extras parser tests
        if: ${{ !cancelled() }}
        run: ./tests/Test-BrowserExtrasParsers.ps1

      - name: Run secrets handling parser test
        if: ${{ !cancelled() }}
        run: ./tests/Test-SecretsHandling.ps1

      - name: Run email parser tests
        if: ${{ !cancelled() }}
        run: ./tests/Test-EmailParsers.ps1

      - name: Run Defender parser tests
        if: ${{ !cancelled() }}
        run: ./tests/Test-DefenderParsers.ps1

      # These two change the runner (audit policy, a temporary user, task,
      # service and event log; temporary registry keys saved with reg save)
      # and undo it afterwards; they do that only when GITHUB_ACTIONS is set
      - name: Run event log parser tests
        if: ${{ !cancelled() }}
        run: ./tests/Test-EventLogParsers.ps1

      - name: Run registry parser tests
        if: ${{ !cancelled() }}
        run: ./tests/Test-RegistryParsers.ps1

      # Phase 2 event logs: also changes the runner (a temporary firewall
      # rule, WMI subscription and NTLM audit settings), undone afterwards
      - name: Run Phase 2 event log parser tests
        if: ${{ !cancelled() }}
        run: ./tests/Test-EventLogParsers2.ps1

      # Runs esentutl on test databases and saves a temporary registry key
      # with reg save (removed afterwards)
      - name: Run SRUM parser tests
        if: ${{ !cancelled() }}
        run: ./tests/Test-SrumParsers.ps1

      # Findings report: the rules engine, report-rules.json against its
      # cases, and the HTML/PDF renderer (Edge headless). No admin, no
      # builder run.
      - name: Run report engine test
        if: ${{ !cancelled() }}
        run: ./tests/Test-ReportEngine.ps1

      - name: Run report rules test
        if: ${{ !cancelled() }}
        run: ./tests/Test-ReportRules.ps1

      - name: Run report renderer test
        if: ${{ !cancelled() }}
        run: ./tests/Test-ReportRender.ps1

      # The builder end to end on tests\fixtures\report\builder: report.html,
      # report.pdf, findings.csv, the workbook's Findings sheet and Finding
      # column, -ReportOnly, -ReportRules and -NoReport. The builder installs
      # ImportExcel from the PowerShell Gallery if the runner lacks it, as it
      # does for a user; without it the workbook checks are skipped.
      - name: Run findings report builder test
        if: ${{ !cancelled() }}
        run: ./tests/Test-ReportBuilder.ps1

      - name: Run zip input test
        if: ${{ !cancelled() }}
        run: ./tests/Test-ZipInput.ps1

      - name: Run mounted devices test
        if: ${{ !cancelled() }}
        run: ./tests/Test-MountedDevices.ps1

      - name: Run memory parser test
        if: ${{ !cancelled() }}
        run: ./tests/Test-MemoryParser.ps1

      - name: Run ShimCache parser test
        if: ${{ !cancelled() }}
        run: ./tests/Test-ShimCacheParser.ps1

      - name: Run summary counts test
        if: ${{ !cancelled() }}
        run: ./tests/Test-SummaryCounts.ps1

      - name: Run scheduled tasks test
        if: ${{ !cancelled() }}
        run: ./tests/Test-ScheduledTasks.ps1

      - name: Run console mode test
        if: ${{ !cancelled() }}
        run: ./tests/Test-ConsoleMode.ps1

  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Run PSScriptAnalyzer (errors only)
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $version = (Get-Module -ListAvailable -Name PSScriptAnalyzer | Sort-Object Version -Descending | Select-Object -First 1).Version
          $files = @(Get-ChildItem -Path . -Filter *.ps1 -Recurse)
          if ($files.Count -eq 0) { Write-Host "::error::No .ps1 files found to analyze"; exit 1 }
          Write-Host "PSScriptAnalyzer $version -- analyzing $($files.Count) script(s): $($files.Name -join ', ')"

          # Rules excluded on purpose are listed (with reasons) in the settings file
          $settings = Join-Path (Get-Location).Path 'PSScriptAnalyzerSettings.psd1'
          $analyzerArgs = @{}
          if (Test-Path -LiteralPath $settings) {
              $analyzerArgs.Settings = $settings
              Write-Host "Using settings: PSScriptAnalyzerSettings.psd1"
          }

          # All remaining rules run; findings show as annotations on the PR,
          # and only errors fail the build
          $results = @(foreach ($f in $files) { Invoke-ScriptAnalyzer -Path $f.FullName @analyzerArgs })
          foreach ($group in ($results | Group-Object Severity)) {
              Write-Host "  $($group.Name): $($group.Count)"
          }
          foreach ($r in $results) {
              $level = if ("$($r.Severity)" -in @('Error', 'ParseError')) { 'error' } else { 'warning' }
              Write-Host "::$level file=$($r.ScriptName),line=$($r.Line)::$($r.RuleName): $($r.Message)"
          }
          $failing = @($results | Where-Object { "$($_.Severity)" -in @('Error', 'ParseError') })
          if ($failing.Count -gt 0) { exit 1 }
          Write-Host "PSScriptAnalyzer: $($results.Count) finding(s), none at error level"
